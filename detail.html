<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>공지사항 상세</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <!-- Bootstrap icons & CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="css/styles.css" rel="stylesheet" />
</head>
<body>
    <nav class="navbar navbar-light bg-light">
        <div class="container">
            <a href="index.html#notice" class="navbar-brand"><i class="bi bi-arrow-left"></i> 공지사항 목록으로</a>
        </div>
    </nav>
    <div class="container mt-5">
        <h2>공지사항 상세</h2>
        <!-- detail content will be filled with a Bootstrap card -->
        <div id="detailContent"></div>
    </div>
    <script>
        // CSV 파서: 큰따옴표 안의 줄바꿈을 포함한 전체 텍스트 파싱
        function parseCSV(text) {
            const rows = [];
            let currentRow = '';
            let inQuotes = false;
            
            for (let i = 0; i < text.length; i++) {
                const ch = text[i];
                
                if (ch === '"') {
                    currentRow += ch;
                    if (inQuotes && text[i + 1] === '"') {
                        currentRow += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if ((ch === '\n' || ch === '\r') && inQuotes) {
                    currentRow += ch;
                    if (ch === '\r' && text[i + 1] === '\n') {
                        i++;
                    }
                } else if ((ch === '\n' || ch === '\r') && !inQuotes) {
                    if (currentRow.trim()) {
                        rows.push(parseCSVLine(currentRow));
                    }
                    currentRow = '';
                    if (ch === '\r' && text[i + 1] === '\n') {
                        i++;
                    }
                } else {
                    currentRow += ch;
                }
            }
            
            if (currentRow.trim()) {
                rows.push(parseCSVLine(currentRow));
            }
            
            return rows;
        }

        // simple CSV line parser that supports quoted fields
        function parseCSVLine(line) {
            const cols = [];
            let cur = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const ch = line[i];
                if (ch === '"') {
                    if (inQuotes && line[i+1] === '"') { cur += '"'; i++; }
                    else { inQuotes = !inQuotes; }
                } else if (ch === ',' && !inQuotes) {
                    cols.push(cur);
                    cur = '';
                } else {
                    cur += ch;
                }
            }
            cols.push(cur);
            return cols.map(s => s.trim());
        }
        function escapeHtml(str) {
            return String(str).replace(/[&<>\"']/g, function (s) {
                return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[s];
            });
        }
        function normalizeNewlines(str) {
            if (!str) return '';
            // convert literal \n, \r\n sequences into actual newlines
            return str.replace(/\\n/g, '\n').replace(/\\r/g, '\r');
        }
        
        // 본문에서 URL과 전화번호를 감지하고 링크로 변환
        function renderContentWithLinks(text, container) {
            if (!text) return;
            
            const normalized = normalizeNewlines(text);
            const escaped = escapeHtml(normalized);
            
            // URL과 전화번호 정규표현식 (000-0000-0000, 11자리 숫자, http(s) URL)
            const combinedRegex = /(\d{3}-\d{4}-\d{4}|\d{11}|https?:\/\/[^\s<>\"]+)/g;
            
            // 매칭된 항목들을 추적
            const urls = [];
            const phones = [];
            let match;
            
            // 모든 매칭 찾기
            while ((match = combinedRegex.exec(escaped)) !== null) {
                if (/^\d{3}-\d{4}-\d{4}$/.test(match[1])) {
                    phones.push(match[1]);
                } else if (/^\d{11}$/.test(match[1])) {
                    phones.push(match[1]);
                } else if (/^https?:\/\//.test(match[1])) {
                    urls.push(match[1]);
                }
            }
            
            // URL과 전화번호를 한 번에 링크로 변환
            const contentHtml = escaped.replace(
                /(\d{3}-\d{4}-\d{4}|\d{11}|https?:\/\/[^\s<>\"]+)/g,
                (match) => {
                    // 전화번호 패턴 000-0000-0000
                    if (/^\d{3}-\d{4}-\d{4}$/.test(match)) {
                        const cleanPhone = match.replace(/-/g, '');
                        return '<a href="tel:' + cleanPhone + '" class="phone-link"><i class="bi bi-telephone-fill"></i> ' + match + '</a>';
                    }
                    // 전화번호 패턴 11자리
                    else if (/^\d{11}$/.test(match)) {
                        return '<a href="tel:' + match + '" class="phone-link"><i class="bi bi-telephone-fill"></i> ' + match + '</a>';
                    }
                    // URL 패턴
                    else if (/^https?:\/\//.test(match)) {
                        return '<a href="' + match + '" target="_blank" class="url-link" rel="noopener noreferrer">' + match + '</a>';
                    }
                    return match;
                }
            );
            
            // 본문 div 생성
            const textPar = document.createElement('div');
            textPar.innerHTML = contentHtml.replace(/\r?\n/g, '<br>');
            textPar.className = 'mb-4 content-text';
            container.appendChild(textPar);
            
            // URL 미리보기 카드 생성
            if (urls.length > 0) {
                const previewContainer = document.createElement('div');
                previewContainer.className = 'url-previews mb-4';
                
                urls.forEach(url => {
                    // 중복된 URL은 한 번만 처리
                    if (previewContainer.querySelector(`[data-url="${escapeHtml(url)}"]`)) return;
                    
                    const previewCard = document.createElement('div');
                    previewCard.className = 'url-preview-card';
                    previewCard.setAttribute('data-url', url);
                    previewCard.innerHTML = '<div class="preview-loading"><i class="bi bi-hourglass-split"></i> 로딩 중...</div>';
                    previewContainer.appendChild(previewCard);
                    
                    // microlink API를 사용해서 메타데이터 가져오기
                    fetch(`https://api.microlink.io?url=${encodeURIComponent(url)}`)
                        .then(r => r.json())
                        .then(data => {
                            if (data.status === 'ok' && data.data) {
                                const meta = data.data;
                                let html = '<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener noreferrer" class="preview-link">';
                                
                                if (meta.image && meta.image.url) {
                                    html += '<div class="preview-image"><img src="' + escapeHtml(meta.image.url) + '" alt="preview"></div>';
                                }
                                
                                html += '<div class="preview-content">';
                                if (meta.title) {
                                    html += '<div class="preview-title">' + escapeHtml(meta.title) + '</div>';
                                }
                                if (meta.description) {
                                    html += '<div class="preview-desc">' + escapeHtml(meta.description).substring(0, 120) + '...</div>';
                                }
                                html += '<div class="preview-url">' + escapeHtml(new URL(url).hostname) + '</div>';
                                html += '</div></a>';
                                
                                previewCard.innerHTML = html;
                                previewCard.classList.add('preview-loaded');
                            } else {
                                // URL 메타데이터 없을 때 기본 표시
                                previewCard.innerHTML = '<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener noreferrer" class="preview-link preview-minimal"><div class="preview-content"><div class="preview-title">링크 보기</div><div class="preview-url">' + escapeHtml(new URL(url).hostname) + '</div></div></a>';
                                previewCard.classList.add('preview-loaded');
                            }
                        })
                        .catch(err => {
                            console.error('Preview fetch error:', err);
                            previewCard.innerHTML = '<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener noreferrer" class="preview-link preview-minimal"><div class="preview-content"><div class="preview-title">링크 보기</div><div class="preview-url">' + escapeHtml(new URL(url).hostname) + '</div></div></a>';
                            previewCard.classList.add('preview-loaded');
                        });
                });
                
                container.appendChild(previewContainer);
            }
        }
        
        function getParam(name) {
            const params = new URLSearchParams(location.search);
            return params.get(name);
        }
        function loadDetail(csvPath = 'data/notice.csv') {
            const id = getParam('id');
            if (!id) {
                document.getElementById('detailContent').textContent = '잘못된 접근입니다.';
                return;
            }
            fetch(csvPath)
                .then(r => {
                    console.log('fetch response', r);
                    return r.text();
                })
                .then(text => {
                    console.log('csv text length', text.length);
                    const lines = parseCSV(text.trim());
                    if (lines.length > 0) lines.shift(); // drop header
                    let found = null;
                    lines.forEach(cols => {
                        if (cols[0] === id) {
                            found = cols;
                        }
                    });
                    console.log('found row', found);
                    const container = document.getElementById('detailContent');
                    if (!found) {
                        container.textContent = '글을 찾을 수 없습니다.';
                        return;
                    }
                    // build a Bootstrap card for the details
                    container.innerHTML = '';
                    const card = document.createElement('div');
                    card.className = 'card mb-4';
                    const body = document.createElement('div');
                    body.className = 'card-body';

                    // title
                    const titleEl = document.createElement('h3');
                    titleEl.className = 'card-title';
                    titleEl.textContent = found[1] || '제목 없음';
                    body.appendChild(titleEl);

                    // meta info (author/date)
                    const meta = document.createElement('p');
                    meta.className = 'text-muted small mb-3';
                    meta.textContent = `작성자: ${found[2] || '-'} · 날짜: ${found[3] || '-'}`;
                    body.appendChild(meta);

                    // optional text content if a 5th column exists (본문 now at index 4)
                    if (found.length > 4 && found[4].trim()) {
                        renderContentWithLinks(found[4], body);
                    }

                    // images (now at index 5)
                    if (found.length > 5 && found[5]) {
                        const names = found[5].split(/[|,]/).map(s=>s.trim()).filter(Boolean);
                        if (names.length > 0) {
                            const imgWrapper = document.createElement('div');
                            imgWrapper.className = 'mb-3';
                            let anyVisible = false;
                            names.forEach(name => {
                                const img = document.createElement('img');
                                img.src = `notice_img/${encodeURIComponent(found[0])}_${encodeURIComponent(name)}`;
                                console.log('creating img', img.src);
                                img.alt = name;
                                img.className = 'img-fluid mb-2';
                                img.onerror = () => { img.style.display = 'none'; console.warn('image failed', img.src); };
                                img.onload = () => { anyVisible = true; console.log('image loaded', img.src); };
                                imgWrapper.appendChild(img);
                            });
                            setTimeout(() => {
                                if (!anyVisible) {
                                    const placeholder = document.createElement('p');
                                    placeholder.className = 'text-muted';
                                    placeholder.textContent = '(이미지 없음)';
                                    imgWrapper.appendChild(placeholder);
                                }
                            }, 500);
                            body.appendChild(imgWrapper);
                        }
                    }

                    card.appendChild(body);
                    container.appendChild(card);
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('detailContent').textContent = '데이터 로드 오류';
                });
        }
        window.addEventListener('DOMContentLoaded', () => loadDetail());
    </script>
</body>
</html>
